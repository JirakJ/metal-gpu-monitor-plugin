name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: chmod +x gradlew

      - run: ./gradlew build -x detekt

      - run: ./gradlew test

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip
