<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
    <!-- Background -->
    <rect width="40" height="40" rx="8" fill="#0F0F1A"/>
    <!-- GPU chip body -->
    <rect x="10" y="10" width="20" height="20" rx="3" fill="#1E1E30" stroke="#9B8AFB" stroke-width="1.5"/>
    <!-- GPU pins - top -->
    <rect x="14" y="7" width="2" height="4" rx="0.5" fill="#9B8AFB"/>
    <rect x="19" y="7" width="2" height="4" rx="0.5" fill="#9B8AFB"/>
    <rect x="24" y="7" width="2" height="4" rx="0.5" fill="#9B8AFB"/>
    <!-- GPU pins - bottom -->
    <rect x="14" y="29" width="2" height="4" rx="0.5" fill="#9B8AFB"/>
    <rect x="19" y="29" width="2" height="4" rx="0.5" fill="#9B8AFB"/>
    <rect x="24" y="29" width="2" height="4" rx="0.5" fill="#9B8AFB"/>
    <!-- GPU pins - left -->
    <rect x="7" y="14" width="4" height="2" rx="0.5" fill="#9B8AFB"/>
    <rect x="7" y="19" width="4" height="2" rx="0.5" fill="#9B8AFB"/>
    <rect x="7" y="24" width="4" height="2" rx="0.5" fill="#9B8AFB"/>
    <!-- GPU pins - right -->
    <rect x="29" y="14" width="4" height="2" rx="0.5" fill="#9B8AFB"/>
    <rect x="29" y="19" width="4" height="2" rx="0.5" fill="#9B8AFB"/>
    <rect x="29" y="24" width="4" height="2" rx="0.5" fill="#9B8AFB"/>
    <!-- Metal logo / M shape in center -->
    <path d="M15 24 L15 17 L18 21 L20 17 L22 21 L25 17 L25 24" fill="none" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
